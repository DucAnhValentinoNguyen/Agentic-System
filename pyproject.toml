[project]
name = "twin"
version = "0.1.0"
description = "Twin: a production agent for ducanhvalentinonguyen.com"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "websockets>=13",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-mcp-adapters>=0.1",
  "mcp>=1.2",
  "openai>=1.54",
  "langfuse>=3",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "grpcio>=1.68",
  "grpcio-tools>=1.68",
  "rank-bm25>=0.2.2",
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "google-api-python-client>=2.150",
  "google-auth-oauthlib>=1.2",
  "langchain>=1.4.3",
  "grpcio-health-checking>=1.84.0",
  "google-cloud-firestore>=2.34.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13", "locust>=2.32"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
